name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  pull-request-check:
    if: ${{ github.event_name == 'pull_request' }}
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Validate Playwright test discovery
      run: npx playwright test --list

  test:
    if: ${{ github.event_name == 'push' }}
    timeout-minutes: 60
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      run: npx playwright test
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        SAUCEDEMO_USERNAME: ${{ secrets.SAUCEDEMO_USERNAME }}
        SAUCEDEMO_PASSWORD: ${{ secrets.SAUCEDEMO_PASSWORD }}
        AI_PROVIDER: gemini
        AI_MODEL: gemini-3.5-flash-lite
        MAX_AI_HEALS_PER_RUN: 5
        SELF_HEALING_ENABLED: true
        SELF_HEALING_ENABLE_IN_CI: true
        SELF_HEALING_TIMEOUT_MS: 20000
        FUZZY_MATCH_THRESHOLD: 0.45
        DOM_MAX_LENGTH: 4000

    - name: Push healed changes
      if: ${{ !cancelled() && github.event_name == 'push' }}
      run: npx tsx scripts/push.ts
      env:
        BRANCH_NAME: ${{ github.ref_name }}

    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30